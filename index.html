<style>
/* ============ TOKENS ============ */
:root{
  --paper:#F4F7FB;
  --surface:#FFFFFF;
  --surface-2:#EAF1F9;
  --ink:#0D1A28;
  --ink-2:#35495F;
  --muted:#61758C;
  --faint:#93A5B8;
  --line:#DAE4F0;
  --line-2:#EBF1F8;

  /* Production phases are ordered, so they get a sequential blue ramp
     (light → dark = further along) rather than four unrelated hues. */
  --ph1:#9CC3EC;
  --ph2:#62A0E0;
  --ph3:#2E77CE;
  --ph4:#17508D;

  --accent:#1668C4;
  --accent-soft:#E4EFFB;
  --ok:#17754A;
  --ok-soft:#E2F1E9;
  --warn:#A96700;
  --warn-soft:#F9EEDA;
  --bad:#B03327;
  --bad-soft:#F9E6E3;
  --outsrc:#9A5400;
  --outsrc-soft:#FBEEDF;

  /* Chart series — validated categorical set, blue first */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7;

  --shadow:0 1px 2px rgba(13,26,40,.05), 0 8px 24px -12px rgba(13,26,40,.16);
  --shadow-lg:0 24px 64px -20px rgba(13,26,40,.32);

  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;

  --r:8px;
  --rail:216px;
}

p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
.lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--faint); font-weight:500;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}

/* ============ SHELL ============ */
.app{display:flex; min-height:100vh}

.rail{
  width:var(--rail); flex:0 0 var(--rail);
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:4px;
  padding:18px 12px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:2px 6px 18px}
.brand-logo{
  display:block; width:150px; height:75px; flex:none;
  background:var(--logo) left center/contain no-repeat;
}
.brand-logo-sm{width:96px; height:48px}
.brand-name{font-size:14.5px; font-weight:650; letter-spacing:-.02em; line-height:1.15}
.brand-sub{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); padding-left:2px}

.nav{display:flex; flex-direction:column; gap:2px}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:8px 10px; border-radius:var(--r); color:var(--ink-2);
  font-size:13.5px; font-weight:500; text-align:left; transition:background .12s, color .12s;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.nav-item svg{flex:0 0 16px; opacity:.85}
.nav-count{
  margin-left:auto; font-family:var(--mono); font-size:10.5px;
  color:var(--faint); font-variant-numeric:tabular-nums;
}
.nav-item[aria-current="page"] .nav-count{color:var(--accent); opacity:.75}

/* "More" tab and its sheet exist only on phones — the desktop rail lists
   every page directly. Must sit after .nav-item to win the display battle. */
.nav-more{display:none}
.moresheet{display:none}

.rail-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:14px; border-top:1px solid var(--line-2)}
.whoami{display:flex; flex-direction:column; gap:5px; padding:0 4px}
.whoami-badge{
  align-self:flex-start; padding:3px 9px; border-radius:999px;
  font-size:11px; font-weight:700; letter-spacing:.02em;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
}
.whoami-badge.is-admin{background:var(--accent-soft); color:var(--accent); border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.whoami-note{font-size:11px; color:var(--faint); line-height:1.45}
.js-leaveadmin{justify-content:center}
.js-leaveadmin[hidden]{display:none}

.menubtn{
  display:none; align-items:center; justify-content:center;
  width:38px; height:38px; border-radius:var(--r); flex:none;
  color:var(--ink-2); border:1px solid var(--line); background:var(--surface);
}
.menubtn:hover{background:var(--surface-2)}

/* ============ MAIN ============ */
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:20px 28px 16px; border-bottom:1px solid var(--line);
  background:var(--paper); position:sticky; top:0; z-index:20;
}
.topbar h1{font-size:19px}
.topbar-sub{font-size:12.5px; color:var(--muted); margin-top:2px}
.topbar-actions{margin-left:auto; display:flex; align-items:center; gap:8px}

.content{padding:24px 28px 64px; display:flex; flex-direction:column; gap:24px}

/* ============ CONTROLS ============ */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px;
  border-radius:var(--r); font-size:13px; font-weight:600;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  transition:background .12s, border-color .12s, transform .08s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.btn-primary:hover{background:var(--ink-2); border-color:var(--ink-2)}
.btn-ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn-sm{padding:5px 10px; font-size:12px}
.btn-danger{color:var(--bad); border-color:transparent}
.btn-danger:hover{background:var(--bad-soft)}
.btn[disabled]{opacity:.4; cursor:not-allowed}

.field{position:relative; display:flex; align-items:center}
.field svg{position:absolute; left:10px; color:var(--faint); pointer-events:none}
.input,.select,.textarea{
  width:100%; padding:8px 11px; border-radius:var(--r);
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:13.5px; transition:border-color .12s, box-shadow .12s;
}
.input:focus,.select:focus,.textarea:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
}
.field .input{padding-left:31px}
.textarea{resize:vertical; min-height:64px; line-height:1.5}
.select{appearance:none; padding-right:28px; cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 51%, calc(100% - 10px) 51%;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat;
}
.input.num,.select.num{font-family:var(--mono)}
.searchbox{width:260px}

/* ============ CARDS ============ */
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow)}
.card-head{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line-2)}
.card-head h3{font-size:14px}
.card-head .lbl{margin-left:auto}

/* ============ KPI ============ */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px}
.kpi{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px 15px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:7px; position:relative; overflow:hidden;
}
.kpi::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--bar,var(--line))}
.kpi-val{font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums}
.kpi-val small{font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0}
.kpi-foot{font-size:11.5px; color:var(--muted); line-height:1.4}
.kpi-foot b{color:var(--ink); font-weight:600}

/* ============ TABLE ============ */
.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
thead th{
  text-align:left; padding:9px 14px; border-bottom:1px solid var(--line);
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--faint); font-weight:500; white-space:nowrap; background:var(--surface);
}
tbody td{padding:11px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer; transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
.t-right{text-align:right}
.t-nowrap{white-space:nowrap}
.jobname{font-weight:600; color:var(--ink); display:block; margin-bottom:2px; line-height:1.3}
.jobcode{font-family:var(--mono); font-size:10.5px; color:var(--faint); letter-spacing:.02em}
.cust{color:var(--ink-2); line-height:1.3}
.cust small{display:block; color:var(--faint); font-size:11px}
.empty{padding:44px 20px; text-align:center; color:var(--muted)}
.empty strong{display:block; color:var(--ink); font-size:14px; margin-bottom:4px}

/* ============ STATUS + PIPELINE ============ */
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 9px 3px 7px;
  border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
}
.chip .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 6px}
/* In-progress stages share one blue chip — the label already names the stage,
   and the phase strip beside it carries how far along the job is. */
.chip.ph-stage{color:var(--accent); background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 26%,transparent)}
.chip.ph-none{color:var(--faint); background:transparent; border-style:dashed}
.chip.ph-done{color:var(--ok); background:var(--ok-soft); border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
.chip.outsrc{color:var(--outsrc); background:var(--outsrc-soft); border-color:color-mix(in srgb,var(--outsrc) 30%,transparent)}
.chip-xs{font-size:10.5px; padding:2px 7px}
.chip.ph-hold{color:var(--warn); background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.chip.ph-cancel{color:var(--bad); background:var(--bad-soft); border-color:color-mix(in srgb,var(--bad) 26%,transparent)}
.chip.due-late{color:var(--bad); background:var(--bad-soft); border-color:color-mix(in srgb,var(--bad) 26%,transparent)}
.chip.due-soon{color:var(--warn); background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 28%,transparent)}

/* CMYK phase strip — 4 segments: prepress / press / finishing / delivery */
.pipe{display:flex; gap:2px; width:96px}
.pipe i{height:4px; flex:1; border-radius:2px; background:var(--line); transition:background .2s}
.pipe i.on-ph1{background:var(--ph1)} .pipe i.on-ph2{background:var(--ph2)}
.pipe i.on-ph3{background:var(--ph3)} .pipe i.on-ph4{background:var(--ph4)}
.pipe.is-half i.cur{opacity:.45}
.pipe-lg{width:100%; gap:3px}
.pipe-lg i{height:6px; border-radius:3px}
.pipe-key{display:flex; gap:3px; margin-top:8px}
.pipe-key span{flex:1; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}

/* money */
.money{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.money-due{color:var(--bad); font-weight:600}
.money-ok{color:var(--ok)}
.money-zero{color:var(--faint)}

/* avatars */
.people{display:flex; align-items:center; gap:-4px}
.av{
  width:24px; height:24px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--mono); font-size:9.5px; font-weight:600; letter-spacing:.02em;
  border:1.5px solid var(--surface); color:#fff; flex:0 0 24px;
}
.av+.av{margin-left:-7px}
.people-names{margin-left:8px; color:var(--ink-2); font-size:12.5px}

.phase-extra{display:flex; flex-direction:column; gap:7px; padding-top:12px; border-top:1px solid var(--line-2)}
.phase-extra div{display:flex; align-items:baseline; gap:8px; font-size:12.5px; color:var(--muted)}
.phase-extra b{margin-left:auto; color:var(--ink); font-size:13px; font-weight:600}

/* ============ CHARTS ============ */
.chartbox{padding:16px}
.chart{width:100%; height:auto; display:block; overflow:visible}
.gridline{stroke:var(--line-2); stroke-width:1}
.axisline{stroke:var(--line); stroke-width:1}
.axis-y,.axis-x{
  font-family:var(--mono); font-size:9.5px; fill:var(--faint);
  font-variant-numeric:tabular-nums;
}
.axis-y{text-anchor:end}
.axis-x{text-anchor:middle}
.bar{fill:var(--accent); transition:fill .12s}
.hit{fill:transparent; cursor:pointer}
.hit:hover ~ .bar{fill:var(--ph4)}
.chart:has(.hit:hover) .bar{opacity:.55}
.slice{stroke:var(--surface); stroke-width:2; cursor:pointer; transition:opacity .12s}
.donut:has(.slice:hover) .slice{opacity:.45}
.donut .slice:hover{opacity:1}

.donutwrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap}
.donut{width:184px; height:184px; flex:0 0 184px}
.donut-v{
  text-anchor:middle; font-family:var(--mono); font-size:26px; font-weight:600;
  fill:var(--ink); font-variant-numeric:tabular-nums;
}
.donut-l{
  text-anchor:middle; font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; fill:var(--faint);
}
.legend{list-style:none; margin:0; padding:0; flex:1 1 190px; display:flex; flex-direction:column; gap:7px; min-width:0}
.legend li{display:flex; align-items:center; gap:9px; font-size:12.5px}
.legend-l{color:var(--ink-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.legend-v{margin-left:auto; color:var(--ink); font-weight:600; font-size:12.5px}
.swatch{width:10px; height:10px; border-radius:3px; flex:0 0 10px}

.rank{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px}
.rank li{display:flex; align-items:center; gap:11px; font-size:13px}
.rank-l{display:flex; align-items:center; gap:7px; flex:0 0 40%; min-width:0; color:var(--ink-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rank-bar{flex:1; height:8px; border-radius:4px; background:var(--line-2); overflow:hidden; min-width:30px}
.rank-bar i{display:block; height:100%; border-radius:4px; background:var(--accent)}
.rank-v{flex:0 0 auto; font-weight:600; color:var(--ink)}
.av-xs{width:19px; height:19px; flex:0 0 19px; font-size:8px; border-width:0}

.charttip{
  position:fixed; z-index:70; pointer-events:none; opacity:0;
  background:var(--ink); color:var(--paper); font-size:12px; font-weight:500;
  padding:6px 10px; border-radius:6px; white-space:nowrap;
  transform:translate(-50%,-130%); transition:opacity .1s;
  box-shadow:var(--shadow);
}
.charttip.show{opacity:1}

/* ============ ATTENTION LIST ============ */
.alist{display:flex; flex-direction:column}
.arow{
  display:flex; align-items:center; gap:12px; padding:11px 16px;
  border-bottom:1px solid var(--line-2); cursor:pointer; text-align:left; width:100%;
  transition:background .1s;
}
.arow:last-child{border-bottom:none}
.arow:hover{background:var(--surface-2)}
.arow-bar{width:3px; align-self:stretch; border-radius:2px; flex:0 0 3px}
.arow-main{min-width:0; flex:1}
.arow-main b{display:block; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.arow-main span{font-size:11.5px; color:var(--muted)}

/* ============ DRAWER ============ */
.scrim{
  position:fixed; inset:0; background:rgba(16,18,21,.42); backdrop-filter:blur(2px);
  opacity:0; pointer-events:none; transition:opacity .22s; z-index:40;
}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(560px,100%);
  background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-lg);
  transform:translateX(101%); transition:transform .26s cubic-bezier(.32,.72,0,1);
  z-index:50; display:flex; flex-direction:column;
}
.drawer.open{transform:none}
.drawer-head{
  display:flex; align-items:flex-start; gap:12px; padding:18px 20px 15px;
  border-bottom:1px solid var(--line); flex:0 0 auto;
}
.drawer-head h2{font-size:16.5px; line-height:1.3}
.drawer-head .jobcode{display:block; margin-top:3px}
.drawer-body{overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:22px; flex:1}
.drawer-foot{
  display:flex; align-items:center; gap:8px; padding:14px 20px;
  border-top:1px solid var(--line); background:var(--surface-2); flex:0 0 auto;
}
.drawer-foot .btn-primary{margin-left:auto}

.fieldset{display:flex; flex-direction:column; gap:11px}
.fieldset > .lbl{padding-bottom:2px; border-bottom:1px solid var(--line-2)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px}
label.f{display:flex; flex-direction:column; gap:5px}
label.f > span{font-size:11.5px; font-weight:600; color:var(--ink-2)}
label.f > span em{font-style:normal; color:var(--faint); font-weight:500}
.hint{font-size:11px; color:var(--faint); line-height:1.45}
.err{font-size:11.5px; color:var(--bad); font-weight:500}
.input.bad,.select.bad{border-color:var(--bad); box-shadow:0 0 0 3px var(--bad-soft)}

.calc{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:11px 13px; border-radius:var(--r); background:var(--surface-2); border:1px solid var(--line);
}
.calc-val{font-family:var(--mono); font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em}

/* segmented control — saved customer vs walk-in */
.seg{display:flex; background:var(--surface-2); border-radius:var(--r); padding:3px; gap:2px}
.seg button{
  flex:1; padding:7px 10px; border-radius:6px; font-size:12.5px; font-weight:600;
  color:var(--muted); transition:background .12s, color .12s;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
#custSaved,#custWalkin{display:flex; flex-direction:column; gap:11px; margin-top:11px}
#custSaved[hidden],#custWalkin[hidden]{display:none}

.locked{display:flex; flex-direction:column; gap:10px}
.locked-head{
  display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:var(--r);
  background:var(--warn-soft); color:var(--warn); font-size:12.5px; font-weight:600;
  border:1px solid color-mix(in srgb,var(--warn) 26%,transparent);
}
.locked-head svg{flex:none}
.outsrc-money{
  display:flex; flex-direction:column; gap:11px; margin-top:13px;
  padding-top:13px; border-top:1px dashed var(--line);
}

label.check{display:flex; align-items:center; gap:9px; cursor:pointer; font-size:13px; color:var(--ink-2)}
label.check input{width:16px; height:16px; accent-color:var(--accent); flex:0 0 16px; cursor:pointer}

/* standalone New Job page */
.formpage{max-width:760px; width:100%; margin:0 auto}
.formpage-body{padding:20px; display:flex; flex-direction:column; gap:22px}
.formpage-foot{
  display:flex; align-items:center; gap:8px; padding:14px 20px;
  border-top:1px solid var(--line); background:var(--surface-2);
  border-radius:0 0 12px 12px;
}
.formpage-foot .btn-primary{margin-left:auto}
.savedmsg-body{padding:52px 24px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px}
.savedmsg-body h3{font-size:19px; margin-top:10px}
.savedmsg-body p{color:var(--muted); font-size:13.5px}
.savedmsg-actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:20px}

/* staff multi-select */
.picks{display:flex; flex-wrap:wrap; gap:7px}
.pick{
  display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 5px;
  border-radius:999px; border:1px solid var(--line); background:var(--surface);
  font-size:12.5px; font-weight:500; transition:border-color .12s, background .12s;
}
.pick:hover{background:var(--surface-2)}
.pick[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600}
.pick[disabled]{opacity:.38; cursor:not-allowed}

/* detail view */
.dl{display:grid; grid-template-columns:118px 1fr; gap:9px 14px; align-items:baseline}
.dl dt{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.dl dd{margin:0; font-size:13.5px; color:var(--ink)}
.dl dd.muted{color:var(--muted)}
.ledger{display:flex; flex-direction:column; gap:0; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.ledger-row{display:flex; align-items:center; gap:10px; padding:10px 13px; border-bottom:1px solid var(--line-2); font-size:13px}
.ledger-row:last-child{border-bottom:none}
.ledger-row .money{margin-left:auto}
.ledger-row.total{background:var(--surface-2); font-weight:600}
.ledger-row small{color:var(--faint); font-size:11px; font-family:var(--mono)}

/* stage stepper in detail */
.stages{display:flex; flex-wrap:wrap; gap:5px}
.stage-btn{
  padding:5px 10px; border-radius:999px; border:1px solid var(--line);
  font-size:11.5px; font-weight:500; color:var(--muted); background:var(--surface);
  transition:all .12s;
}
.stage-btn:hover{background:var(--surface-2); color:var(--ink)}
.stage-btn.done{color:var(--ink-2); border-color:var(--line)}
.stage-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:600}

/* ============ TOOLBAR / FILTERS ============ */
.toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tabs{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:var(--r)}
.tabs button{
  padding:5px 11px; border-radius:6px; font-size:12.5px; font-weight:500; color:var(--muted);
  transition:background .12s,color .12s;
}
.tabs button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08)}

const KEY = "presstrack.demo.v1";
const ROLE_KEY = "presstrack.role";
let db, route="new", role="staff";
let filter={q:"", tab:"active"};

/* No passwords: the role comes from the link you open, and the device
   remembers it. Opening .../#admin turns this device into an admin device
   until "Leave admin" is used. Everyone else lands as staff.
   This is convenience, not security — see the README. */
function loadRole(){
  let r = null;
  try{ r = localStorage.getItem(ROLE_KEY); }catch(e){}
  const h = (location.hash || "").replace(/^#\/?/, "").toLowerCase();
  if(h === "admin"){ r = "admin"; saveRole(r); }
  else if(h === "staff"){ r = "staff"; saveRole(r); }
  role = r === "admin" ? "admin" : "staff";
}
function saveRole(r){
  try{ localStorage.setItem(ROLE_KEY, r); }catch(e){}
}
function setRole(r){
  role = r; saveRole(r);
  document.body.setAttribute("data-role-mode", r);
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ db = migrate(JSON.parse(raw)); return; }
  }catch(e){ /* private mode / corrupt data — fall through to seed */ }
  db = seed();
}

/* Bring data saved by an earlier version up to the current shape. */
function migrate(d){
  if(!d.partners) d.partners = [];
  (d.jobs || []).forEach(function(j){
    if(RETIRED_STAGES[j.status]) j.status = RETIRED_STAGES[j.status];
    if(j.outsourced === undefined) j.outsourced = false;
    if(!j.type) j.type = "Other";
    if(j.outsourceCost === undefined) j.outsourceCost = 0;
    if(j.outsourcePaid === undefined) j.outsourcePaid = 0;
    if(j.outsourcePaidDate === undefined) j.outsourcePaidDate = "";
  });
  return d;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ /* storage unavailable — demo still works for this session */ }
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid = p => p + Math.random().toString(36).slice(2,9);

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso){
  if(!iso) return "—";
  const p = iso.split("-");
  if(p.length!==3) return iso;
  return p[2] + " " + MONTHS[+p[1]-1] + " " + p[0];
}
function daysBetween(a,b){
  return Math.round((Date.parse(b+"T00:00:00") - Date.parse(a+"T00:00:00")) / 86400000);
}
function money(n){
  const v = Number(n)||0;
  return "Rs " + v.toLocaleString("en-US", {maximumFractionDigits:0});
}
function initials(name){
  const parts = String(name).trim().split(/\s+/);
  return ((parts[0]||"")[0] || "") + ((parts[1]||"")[0] || "");
}
function avColor(id){
  let h=0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}

const staffById   = id => db.staff.find(s=>s.id===id);
const custById    = id => db.customers.find(c=>c.id===id);
const partnerById = id => (db.partners||[]).find(p=>p.id===id);
const statusMeta  = id => ALL_STATUSES.find(s=>s.id===(id||"")) || {id:id,label:id};

// Where an outsourced job actually went — a saved partner, or a one-off typed
// onto the job. Mirrors jobCustomer(); saved partners can be deleted too.
function jobPartner(j){
  if(!j.outsourced) return null;
  if(j.outsourceId){
    const p = partnerById(j.outsourceId);
    if(p) return {name:p.name, company:p.company, phone:p.phone, note:p.note, saved:true};
  }
  return {name:j.outsourceName || "Not recorded", company:j.outsourceCompany || "",
          phone:j.outsourcePhone || "", note:"", saved:false};
}

// A job belongs either to a saved customer, or to a walk-in whose name and
// number live on the job itself. Saved customers can be deleted after the fact,
// so never assume the lookup succeeds — fall back to whatever the job carries.
function jobCustomer(j){
  if(j.customerId){
    const c = custById(j.customerId);
    if(c) return {name:c.name, company:c.company, phone:j.phone || c.phone, note:c.note, saved:true};
  }
  return {name:j.customerName || "Walk-in customer", company:"", phone:j.phone || "", note:"", saved:false};
}
function jobPhone(j){ return jobCustomer(j).phone; }
function paid(j){ return (Number(j.advance)||0) + (Number(j.finalAmount)||0); }
function balance(j){ return Math.max(0, (Number(j.total)||0) - paid(j)); }
function isClosed(j){ return j.status==="completed" || j.status==="cancelled"; }
// "On the floor" = work still physically in the shop. A handed-over job is done,
// even if the money hasn't come in yet — that's a payment problem, not a production one.
function isActive(j){ return !isClosed(j) && j.status!=="hold" && j.status!=="delivered"; }
function plural(n, word){ return n + " " + word + (n===1 ? "" : "s"); }

function phaseOf(status){
  const s = STAGES.find(x=>x.id===status);
  return s ? s.phase : null;
}
function phaseIndex(status){
  const p = phaseOf(status);
  return p ? PHASES.findIndex(x=>x.id===p) : -1;
}
function chipClass(status){
  if(!status) return "ph-none";
  if(status==="completed") return "ph-done";
  if(status==="hold") return "ph-hold";
  if(status==="cancelled") return "ph-cancel";
  return "ph-stage";
}

/* Due-date state: overdue, due soon (<=3 days), or fine. */
function dueState(j){
  // Only meaningful while the job is still in the shop — once it's handed over,
  // the deadline stopped mattering.
  if(!isActive(j) || !j.dueDate) return null;
  const d = daysBetween(TODAY, j.dueDate);
  if(d < 0)  return {cls:"due-late", text:Math.abs(d)+"d late"};
  if(d === 0) return {cls:"due-late", text:"Due today"};
  if(d <= 3) return {cls:"due-soon", text:"in "+d+"d"};
  return null;
}

function pipeHTML(status, big){
  const idx = phaseIndex(status);
  const done = status==="completed";
  let cells = "";
  for(let i=0;i<4;i++){
    let cls = "";
    if(done) cls = "on-"+PHASES[i].key;
    else if(idx>-1 && i<idx) cls = "on-"+PHASES[i].key;
    else if(idx>-1 && i===idx) cls = "on-"+PHASES[i].key+" cur";
    cells += '<i class="'+cls+'"></i>';
  }
  const half = (!done && idx>-1) ? " is-half" : "";
  return '<div class="pipe'+(big?" pipe-lg":"")+half+'" role="img" aria-label="'+esc(statusMeta(status).label)+'">'+cells+'</div>';
}

function peopleHTML(ids, withNames){
  if(!ids || !ids.length) return '<span class="money-zero">—</span>';
  let h = '<div class="people">';
  ids.forEach(function(id){
    const s = staffById(id);
    if(!s) return;
    h += '<span class="av" style="background:'+avColor(s.id)+'" title="'+esc(s.name)+'">'+esc(initials(s.name))+'</span>';
  });
  if(withNames){
    const names = ids.map(function(id){ const s=staffById(id); return s?s.name:null; }).filter(Boolean).join(", ");
    h += '<span class="people-names">'+esc(names)+'</span>';
  }
  return h + '</div>';
}

/* Promise-based confirm, so the flow reads top-to-bottom at the call site.
   Browser confirm() is unstyled and easy to dismiss by accident on a phone. */
let confirmResolve = null;
function askConfirm(opts){
  const el = $("#confirm");
  el.innerHTML =
    '<div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">'
      + '<h3 id="confirmTitle">'+esc(opts.title)+'</h3>'
      + (opts.body ? '<div class="confirm-body">'+opts.body+'</div>' : '')
      + '<div class="confirm-actions">'
        + '<button class="btn" data-confirm="0">'+esc(opts.cancel || "Go back")+'</button>'
        + '<button class="btn '+(opts.danger?"btn-danger-solid":"btn-primary")+'" data-confirm="1">'
          + esc(opts.ok || "Yes, save")+'</button>'
      + '</div>'
    + '</div>';
  el.classList.add("open");
  const first = el.querySelector('[data-confirm="1"]');
  if(first) setTimeout(function(){ first.focus(); }, 40);
  return new Promise(function(res){ confirmResolve = res; });
}
function closeConfirm(v){
  if(!confirmResolve) return;
  $("#confirm").classList.remove("open");
  const r = confirmResolve; confirmResolve = null;
  r(v);
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

function renderDashboard(){
  const active   = db.jobs.filter(isActive);
  const overdue  = active.filter(function(j){ return j.dueDate && daysBetween(TODAY, j.dueDate) < 0; });
  const dueSoon  = active.filter(function(j){ const d = j.dueDate ? daysBetween(TODAY,j.dueDate) : 99; return d>=0 && d<=3; });
  const awaiting = db.jobs.filter(function(j){ return j.status==="ready"; });
  const owing    = db.jobs.filter(function(j){ return !isClosed(j) && balance(j)>0; });
  const outstanding = owing.reduce(function(s,j){ return s+balance(j); }, 0);
  const collected = db.jobs.reduce(function(s,j){ return s+paid(j); }, 0);

  // Attention rows, most urgent reason first. A job can qualify more than once
  // (late AND unpaid) — it should still appear once, under its worst problem.
  const attention = [];
  const flagged = {};
  function flag(j, color, sub){
    if(flagged[j.id]) return;
    flagged[j.id] = true;
    attention.push({job:j, color:color, title:j.name, sub:sub});
  }
  db.jobs.filter(function(j){ return j.status==="delivered" && balance(j)>0; }).forEach(function(j){
    flag(j, "var(--bad)", "Handed over "+fmtDate(j.handoverDate)+" · "+money(balance(j))+" still unpaid");
  });
  overdue.forEach(function(j){
    flag(j, "var(--bad)", "Deadline passed "+plural(Math.abs(daysBetween(TODAY,j.dueDate)),"day")+" ago · still in "+statusMeta(j.status).label);
  });
  awaiting.forEach(function(j){
    flag(j, "var(--accent)", "Finished and waiting for customer collection");
  });
  dueSoon.forEach(function(j){
    flag(j, "var(--warn)", "Due "+fmtDate(j.dueDate)+" · currently in "+statusMeta(j.status).label);
  });

  // Workload per phase
  const byPhase = PHASES.map(function(p){
    return {p:p, n:active.filter(function(j){ return phaseOf(j.status)===p.id; }).length};
  });
  const maxPhase = Math.max(1, Math.max.apply(null, byPhase.map(function(x){return x.n;})));
  const unstaged = active.filter(function(j){ return !j.status; }).length;
  const outLive  = active.filter(function(j){ return j.outsourced; }).length;

  const recent = db.jobs.slice().sort(function(a,b){
    return (b.startDate||"").localeCompare(a.startDate||"");
  }).slice(0,6);

  $("#view").innerHTML =
    '<section class="kpis">'
    + kpi("Jobs on the floor", active.length, "", "var(--accent)",
        overdue.length ? '<b>'+overdue.length+' past deadline</b> · '+dueSoon.length+' due within 3 days'
                       : dueSoon.length+' due within 3 days')
    + kpi("Ready for handover", awaiting.length, "", "var(--ph3)",
        awaiting.length ? 'Finished work sitting in the shop' : 'Nothing waiting')
    + kpi("Money still owed", money(outstanding), "", "var(--bad)",
        'Across <b>'+owing.length+'</b> unsettled jobs')
    + kpi("Collected to date", money(collected), "", "var(--ok)",
        'All advances and final payments')
    + '</section>'

    + '<div class="dash-split">'

      + '<section class="card">'
        + '<div class="card-head"><h3>Needs attention</h3><span class="lbl">'+attention.length+' items</span></div>'
        + (attention.length
            ? '<div class="alist">' + attention.slice(0,7).map(function(a){
                return '<button class="arow" data-job="'+a.job.id+'">'
                  + '<span class="arow-bar" style="background:'+a.color+'"></span>'

  const tab = TABS.find(function(t){ return t.id===filter.tab; }) || TABS[0];

/* On an outsourced job the shop keeps the difference between what the customer
   pays and what the outsourcer charges. */
const commission  = j => j.outsourced ? (Number(j.total)||0) - (Number(j.outsourceCost)||0) : 0;
const owedToParty = j => j.outsourced && j.status!=="cancelled"
  ? Math.max(0, (Number(j.outsourceCost)||0) - (Number(j.outsourcePaid)||0)) : 0;

/* ===================== ANALYTICS ===================== */

/* Buckets run backwards from TODAY. Each granularity picks a window that keeps
   the bar count readable — 14 days, 12 weeks, 12 months. */
const RANGES = [
  {id:"daily",   label:"Daily",   unit:"day",   count:14, hint:"Last 14 days"},
  {id:"weekly",  label:"Weekly",  unit:"week",  count:12, hint:"Last 12 weeks"},
  {id:"monthly", label:"Monthly", unit:"month", count:12, hint:"Last 12 months"}
];
let range = "weekly";

// Both sides must agree on the timezone. isoFromDayNum reads back through
// toISOString (UTC), so parse in UTC too — otherwise every bucket lands a day
// out for anyone east of Greenwich.
function dayNum(iso){ return Math.floor(Date.parse(iso+"T00:00:00Z")/86400000); }
function isoFromDayNum(n){ return new Date(n*86400000).toISOString().slice(0,10); }

/* Returns [{key, label, start, end}] oldest first, plus the overall window. */
function buildBuckets(){
  const r = RANGES.find(function(x){ return x.id===range; });
  const out = [];
  if(r.unit === "day"){
    const t = dayNum(TODAY);
    for(let i=r.count-1; i>=0; i--){
      const d = isoFromDayNum(t-i);
      out.push({key:d, label:d.slice(8)+" "+MONTHS[+d.slice(5,7)-1], start:d, end:d});
    }
  }else if(r.unit === "week"){
    const t = dayNum(TODAY);
    const dow = (new Date(TODAY+"T00:00:00Z").getUTCDay() + 6) % 7;  // Monday = 0
    const thisMonday = t - dow;
    for(let i=r.count-1; i>=0; i--){
      const s = thisMonday - i*7;
      const st = isoFromDayNum(s), en = isoFromDayNum(s+6);
      out.push({key:st, label:st.slice(8)+" "+MONTHS[+st.slice(5,7)-1], start:st, end:en});
    }
  }else{
    const y = +TODAY.slice(0,4), m = +TODAY.slice(5,7);
    for(let i=r.count-1; i>=0; i--){
      let mm = m - i, yy = y;
      while(mm < 1){ mm += 12; yy -= 1; }
      const st = yy+"-"+String(mm).padStart(2,"0")+"-01";
      const lastDay = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
      const en = yy+"-"+String(mm).padStart(2,"0")+"-"+lastDay;
      out.push({key:st, label:MONTHS[mm-1]+(mm===1||i===r.count-1 ? " "+String(yy).slice(2) : ""), start:st, end:en});
    }
  }
  // Buckets keep their true end so the current week/month still collects
  // everything, but never advertise a window running into the future.
  const end = out[out.length-1].end;
  return {buckets:out, from:out[0].start, to:end, shownTo:(end > TODAY ? TODAY : end), meta:r};
}

const inWindow = (iso, from, to) => !!iso && iso >= from && iso <= to;

/* Every payment event in the window, so money is counted on the date it was
   actually received rather than the date the job started. */
function paymentsIn(from, to){
  const rows = [];
  db.jobs.forEach(function(j){
    if(inWindow(j.advanceDate, from, to) && Number(j.advance))
      rows.push({date:j.advanceDate, amount:Number(j.advance), job:j, kind:"Advance"});
    if(inWindow(j.finalDate, from, to) && Number(j.finalAmount))
      rows.push({date:j.finalDate, amount:Number(j.finalAmount), job:j, kind:"Final payment"});
  });
  return rows;
}

function countBy(list, keyFn){
  const map = {};
  list.forEach(function(x){
    const k = keyFn(x);
    if(k === null || k === undefined) return;
    map[k] = (map[k]||0) + 1;
  });
  return Object.keys(map).map(function(k){ return {label:k, value:map[k]}; })
               .sort(function(a,b){ return b.value-a.value; });
}

/* ---------- chart primitives ---------- */

function compactMoney(v){
  if(v >= 1000000) return "Rs " + (v/1000000).toFixed(v%1000000 ? 1 : 0) + "M";
  if(v >= 1000)    return "Rs " + Math.round(v/1000) + "k";
  return "Rs " + v;
}
function niceMax(v){
  if(v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return step * mag;
}

/* Vertical bars, one per bucket. Single series, so no legend — the title says
   what it is. 4px rounded data end anchored to the baseline. */
const isNarrow = () => window.innerWidth <= 760;

/* The viewBox is sized to the container, not the type: an SVG scales as a
   whole, so a chart in a narrow box needs a SMALLER viewBox to keep 9.5px
   labels rendering near 9.5px instead of shrinking to 4px. */
const CHART_SIZES = {
  full:    {W:760, H:236, padL:62, padB:34, gap:8, maxLabels:8},
  compact: {W:430, H:212, padL:44, padB:30, gap:5, maxLabels:5},
  narrow:  {W:330, H:200, padL:38, padB:28, gap:4, maxLabels:4}
};

function barChart(buckets, values, fmt, compact){
  const S = CHART_SIZES[isNarrow() ? "narrow" : (compact ? "compact" : "full")];
  const W = S.W, H = S.H, padL = S.padL, padR = 8, padT = 14, padB = S.padB;
  const iw = W-padL-padR, ih = H-padT-padB;
  const max = niceMax(Math.max.apply(null, values.concat([0])));
  const slot = iw / buckets.length;
  const bw = Math.max(4, Math.min(42, slot - S.gap));
  const y = v => padT + ih - (v/max)*ih;
  // Anchor the label rhythm to the LAST bucket and step backwards, so the most
  // recent period is always labelled and never crowds its neighbour.
  const every = buckets.length > S.maxLabels ? Math.ceil(buckets.length/S.maxLabels) : 1;

  let grid = "", bars = "";
  for(let i=0;i<=4;i++){
    const v = max*i/4, yy = y(v);
    grid += '<line class="gridline" x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'"/>'
          + '<text class="axis-y" x="'+(padL-9)+'" y="'+(yy+3.5)+'">'+(i?fmt(v):"0")+'</text>';
  }
  buckets.forEach(function(b, i){
    const v = values[i];
    const cx = padL + slot*i + slot/2;
    const x = cx - bw/2;
    const h = v > 0 ? Math.max(3, ih - (y(v)-padT)) : 0;
    if(h > 0){
      const r = Math.min(4, bw/2, h);
      // rounded top, square base
      bars += '<path class="bar" d="M'+x+' '+(padT+ih)+'V'+(padT+ih-h+r)
            + 'a'+r+' '+r+' 0 0 1 '+r+' '+(-r)+'h'+(bw-2*r)
            + 'a'+r+' '+r+' 0 0 1 '+r+' '+r+'V'+(padT+ih)+'Z"'
            + ' data-tip="'+esc(b.label+" · "+fmt(v))+'"/>';
    }
    if((buckets.length-1-i) % every === 0)
      bars += '<text class="axis-x" x="'+cx+'" y="'+(H-12)+'">'+esc(b.label)+'</text>';
    // hover target spans the whole slot so thin bars stay easy to hit
    bars += '<rect class="hit" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+ih+'"'
          + ' data-tip="'+esc(b.label+" · "+fmt(v))+'"/>';
  });

  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" preserveAspectRatio="xMidYMid meet">'
    + grid
    + '<line class="axisline" x1="'+padL+'" y1="'+(padT+ih)+'" x2="'+(W-padR)+'" y2="'+(padT+ih)+'"/>'
    + bars + '</svg>';
}

function arcPath(cx, cy, ro, ri, a0, a1){
  const P = (r,a) => [(cx + r*Math.cos(a)).toFixed(2), (cy + r*Math.sin(a)).toFixed(2)];
  const big = (a1-a0) > Math.PI ? 1 : 0;
  const A = P(ro,a0), B = P(ro,a1), C = P(ri,a1), D = P(ri,a0);
  return 'M'+A[0]+' '+A[1]+'A'+ro+' '+ro+' 0 '+big+' 1 '+B[0]+' '+B[1]
       + 'L'+C[0]+' '+C[1]+'A'+ri+' '+ri+' 0 '+big+' 0 '+D[0]+' '+D[1]+'Z';
}

/* Donut + direct-labelled legend. The legend carries the value for every slice,
   which is also what satisfies the light-mode contrast relief rule. */
function donut(items, total, centreLabel, centreValue){
  const S = 200, c = S/2, ro = 92, ri = 58;
  let segs = "", a = -Math.PI/2;

  if(!total){
    segs = '<circle cx="'+c+'" cy="'+c+'" r="'+((ro+ri)/2)+'" fill="none" stroke="var(--line)" stroke-width="'+(ro-ri)+'"/>';
  }else if(items.length === 1){
    segs = '<circle cx="'+c+'" cy="'+c+'" r="'+((ro+ri)/2)+'" fill="none" stroke="var(--s1)" stroke-width="'+(ro-ri)+'"'
         + ' data-tip="'+esc(items[0].label+" · "+items[0].value)+'"/>';
  }else{
    items.forEach(function(it, i){
      const a1 = a + (it.value/total)*Math.PI*2;
      segs += '<path class="slice" d="'+arcPath(c,c,ro,ri,a,a1)+'" fill="var(--s'+((i%7)+1)+')"'
            + ' data-tip="'+esc(it.label+" · "+it.value+" ("+Math.round(it.value/total*100)+"%)")+'"/>';
      a = a1;
    });
  }
  return '<div class="donutwrap">'
    + '<svg class="donut" viewBox="0 0 '+S+' '+S+'" role="img">'+segs
      + '<text class="donut-v" x="'+c+'" y="'+(c-2)+'">'+esc(centreValue)+'</text>'
      + '<text class="donut-l" x="'+c+'" y="'+(c+16)+'">'+esc(centreLabel)+'</text>'
    + '</svg>'
    + '<ul class="legend">' + items.map(function(it,i){
        return '<li><span class="swatch" style="background:var(--s'+((i%7)+1)+')"></span>'
          + '<span class="legend-l">'+esc(it.label)+'</span>'
          + '<span class="legend-v num">'+it.value+'</span></li>';
      }).join("") + '</ul>'
  + '</div>';
}

/* Horizontal bars for ranked lists — long names read better on the left. */
function rankBars(items, fmt){
  if(!items.length) return '<div class="empty"><strong>Nothing in this period</strong>Try a wider range.</div>';
  const max = Math.max.apply(null, items.map(function(i){ return i.value; }));
  return '<ul class="rank">' + items.map(function(it){
    return '<li>'
      + '<span class="rank-l">'+ (it.badge || "") + esc(it.label)+'</span>'
      + '<span class="rank-bar"><i style="width:'+Math.max(2,(it.value/max)*100)+'%"></i></span>'
      + '<span class="rank-v num">'+esc(fmt ? fmt(it.value) : it.value)+'</span>'
    + '</li>';
  }).join("") + '</ul>';
}

function renderAnalytics(){
  const R = buildBuckets();
  const from = R.from, to = R.to;

  const startedIn = db.jobs.filter(function(j){ return inWindow(j.startDate, from, to); });
  const pays      = paymentsIn(from, to);
  const received  = pays.reduce(function(s,p){ return s+p.amount; }, 0);

  // Money per bucket, counted on the date each payment landed
  const money = R.buckets.map(function(b){
    return pays.filter(function(p){ return p.date >= b.start && p.date <= b.end; })
               .reduce(function(s,p){ return s+p.amount; }, 0);
  });
  const jobsPer = R.buckets.map(function(b){
    return startedIn.filter(function(j){ return j.startDate >= b.start && j.startDate <= b.end; }).length;
  });

  // Job types — top 6 plus Other, never a generated 8th hue
  const allTypes = countBy(startedIn, function(j){ return j.type || "Other"; });
  const topTypes = allTypes.slice(0,6);
  const restSum  = allTypes.slice(6).reduce(function(s,t){ return s+t.value; }, 0);
  const typeItems = restSum ? topTypes.concat([{label:"Other types", value:restSum}]) : topTypes;

  // Who handled the work
  const byStaff = {};
  startedIn.forEach(function(j){
    (j.assigned||[]).forEach(function(id){ byStaff[id] = (byStaff[id]||0)+1; });
  });
  const staffItems = Object.keys(byStaff).map(function(id){
    const s = staffById(id);
    return {label:s?s.name:"(removed)", value:byStaff[id],
            badge: s ? '<span class="av av-xs" style="background:'+avColor(s.id)+'">'+esc(initials(s.name))+'</span>' : ""};
  }).sort(function(a,b){ return b.value-a.value; });

  // Where the jobs in this window stand now
  const pending   = startedIn.filter(function(j){ return !isClosed(j); });
  const standing  = [
    {label:"Still on the floor", value:startedIn.filter(isActive).length},
    {label:"Ready for handover", value:startedIn.filter(function(j){ return j.status==="ready"; }).length},
    {label:"Handed over",        value:startedIn.filter(function(j){ return j.status==="delivered"; }).length},
    {label:"On hold",            value:startedIn.filter(function(j){ return j.status==="hold"; }).length},
    {label:"Completed",          value:startedIn.filter(function(j){ return j.status==="completed"; }).length}
  ].filter(function(x){ return x.value > 0; });

  const owedFromRange = pending.reduce(function(s,j){ return s+balance(j); }, 0);
  const outsourcedIn  = startedIn.filter(function(j){ return j.outsourced; }).length;

  $("#view").innerHTML =
    '<div class="toolbar">'
      + '<div class="tabs" role="group" aria-label="Time range">'
      + RANGES.map(function(r){
          return '<button data-range="'+r.id+'" aria-pressed="'+(range===r.id)+'">'+r.label+'</button>';
        }).join("")
      + '</div>'
      + '<span class="hint">'+R.meta.hint+' · '+fmtDate(from)+' to '+fmtDate(R.shownTo)+'</span>'
    + '</div>'

    + '<section class="kpis">'
      + kpi("Jobs booked in", startedIn.length, "", "var(--accent)",
          outsourcedIn ? '<b>'+outsourcedIn+'</b> of them sent outside' : 'None sent outside')
      + kpi("Money received", compactMoney(received), "", "var(--ok)",
          plural(pays.length,"payment")+' in this period')
      + kpi("Still to collect", compactMoney(owedFromRange), "", "var(--bad)",
          'From '+plural(pending.length,"unfinished job")+' booked in this period')
      + kpi("Pending jobs", pending.length, "", "var(--warn)",
          pending.length ? 'Not yet completed or cancelled' : 'Everything is closed off')
    + '</section>'

    + '<section class="card">'
      + '<div class="card-head"><h3>Money received</h3><span class="lbl">'+R.meta.hint+'</span></div>'
      + '<div class="chartbox">' + barChart(R.buckets, money, compactMoney) + '</div>'
    + '</section>'

    + '<div class="dash-split">'
      + '<section class="card">'
        + '<div class="card-head"><h3>What came in most</h3><span class="lbl">by job type</span></div>'
        + '<div class="chartbox">'
          + (startedIn.length
              ? donut(typeItems, startedIn.length, "jobs", String(startedIn.length))
              : '<div class="empty"><strong>No jobs in this period</strong>Try a wider range.</div>')
        + '</div>'
      + '</section>'
      + '<section class="card">'
        + '<div class="card-head"><h3>Who handled the most</h3><span class="lbl">jobs assigned</span></div>'
        + '<div class="chartbox">' + rankBars(staffItems) + '</div>'
      + '</section>'
    + '</div>'

    + '<div class="dash-split">'
      + '<section class="card">'
        + '<div class="card-head"><h3>Jobs booked in</h3><span class="lbl">'+R.meta.hint+'</span></div>'
        + '<div class="chartbox">' + barChart(R.buckets, jobsPer, function(v){ return String(Math.round(v)); }, true) + '</div>'
      + '</section>'
      + '<section class="card">'
        + '<div class="card-head"><h3>Where they stand now</h3><span class="lbl">of this period\'s jobs</span></div>'
        + '<div class="chartbox">' + rankBars(standing) + '</div>'
      + '</section>'
    + '</div>';
}

function savePartner(id){
  const f = $("#partnerForm"), err = $("#formErr");
  f.querySelectorAll(".bad").forEach(function(el){ el.classList.remove("bad"); });
  if(!f.name.value.trim() && !f.company.value.trim()){
    err.textContent = "Enter a company or a contact name."; err.hidden = false;
    f.company.classList.add("bad"); return;
  }
  const data = {
    name:f.name.value.trim() || f.company.value.trim(),
    company:f.company.value.trim(), phone:f.phone.value.trim(), note:f.note.value.trim()
  };
  if(id){ Object.assign(partnerById(id), data); toast("Details updated"); }
  else{ data.id = uid("p"); db.partners.push(data); toast((data.company||data.name) + " saved"); }
  save(); closeDrawer(); render();
}

let drawerOpen = false, lastFocus = null;

function openDrawer(html){
  lastFocus = document.activeElement;
  const d = $("#drawer");
  d.innerHTML = html;
  d.setAttribute("aria-hidden","false");
  d.classList.add("open");
  $("#scrim").classList.add("open");
  drawerOpen = true;
  const first = d.querySelector("input,select,textarea,button");
  if(first) setTimeout(function(){ first.focus(); }, 260);
}
function closeDrawer(){
  if(!drawerOpen) return;
  $("#drawer").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden","true");
  $("#scrim").classList.remove("open");
  drawerOpen = false;
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}

function updateCalc(){
  const f = $("#jobForm"); if(!f) return;
  const n = function(v){ return Number(String(v).replace(/[^0-9.-]/g,"")) || 0; };
  const total = n(f.total.value);
  const bal = total - n(f.advance.value) - n(f.finalAmount.value);
  const el = $("#calcBal");
  if(!total){                        // nothing costed yet — don't claim it's settled
    el.textContent = "Rs 0";
    el.style.color = "var(--faint)";
  }else{
    el.textContent = bal > 0 ? money(bal) : (bal < 0 ? "Overpaid by " + money(-bal) : "Fully settled");
    el.style.color = bal > 0 ? "var(--bad)" : (bal < 0 ? "var(--warn)" : "var(--ok)");
  }
}

/* Commission is what the shop keeps: what the customer pays minus what the
   outsourcer charges. Always derived, never typed. */
function updateComm(){
  const f = $("#jobForm"); if(!f) return;
  const el = $("#calcComm"); if(!el) return;
  const n = function(v){ return Number(String(v).replace(/[^0-9.-]/g,"")) || 0; };
  const total = f.total ? n(f.total.value) : n(jobById(f) ? jobById(f).total : 0);
  const cost  = f.outsourceCost ? n(f.outsourceCost.value) : 0;
  const comm  = total - cost;
  if(!total || !cost){
    el.textContent = "Rs 0";
    el.style.color = "var(--faint)";
  }else{
    el.textContent = comm >= 0 ? money(comm) : "Short by " + money(-comm);
    el.style.color = comm > 0 ? "var(--ok)" : comm === 0 ? "var(--muted)" : "var(--bad)";
  }
}
// The form may be locked, in which case the total lives on the job, not a field.
function jobById(f){
  const btn = document.querySelector("[data-save-job]");
  const id = btn ? btn.getAttribute("data-save-job") : "";
  return id ? db.jobs.find(function(x){ return x.id===id; }) : null;
}

function updateCustHint(){
  const f = $("#jobForm"); if(!f || !f.customerId) return;
  const h = $("#custHint"); if(!h) return;
  const c = custById(f.customerId.value);
  if(!c){ h.textContent = "Pick a saved customer, or switch to Walk-in for a one-off."; return; }
  h.innerHTML = 'Using <b>'+esc(c.company || "individual customer")+'</b> · '
    + '<span class="num">'+esc(c.phone||"no number on file")+'</span>'
    + (c.note ? ' · '+esc(c.note) : '');
}

async function saveJob(id, stayOnPage){
  const f = $("#jobForm");
  const err = $("#formErr");
  const n = function(v){ return Number(String(v).replace(/[^0-9.-]/g,"")) || 0; };
  const problems = [];

  f.querySelectorAll(".bad").forEach(function(el){ el.classList.remove("bad"); });

  if(!f.name.value.trim()){ problems.push("Give the job a name."); f.name.classList.add("bad"); }

  if(custMode === "walkin"){
    // A walk-in has no record anywhere else, so the name and number on the job
    // are the only way to ever contact them again — both are required.
    if(!f.customerName.value.trim()){
      problems.push("Enter the customer's name."); f.customerName.classList.add("bad");
    }
    if(!f.walkPhone.value.trim()){
      problems.push("Enter a phone number."); f.walkPhone.classList.add("bad");
    }
  }else if(!f.customerId.value){
    problems.push("Choose a customer, or switch to Walk-in.");
    f.customerId.classList.add("bad");
  }

  if(!formPicks.length){ problems.push("Assign at least one person."); }
  if(f.startDate.value && f.dueDate.value && f.dueDate.value < f.startDate.value){
    problems.push("The deadline is before the start date.");
    f.dueDate.classList.add("bad");
  }
  // Company and number are optional for an outsourcer, but a name is not —
  // otherwise the job says it went out and can't say where.
  if(f.outsourced.checked && !f.outsourceId.value && !f.outsourceName.value.trim()){
    problems.push("Say who the job went to, or pick one from the list.");
    f.outsourceName.classList.add("bad");
  }

  if(problems.length){
    err.textContent = problems.join(" ");
    err.hidden = false;
    err.scrollIntoView({block:"nearest", behavior:"smooth"});
    return;
  }
  err.hidden = true;

  // When a control isn't on the form — locked for staff, or admin-only — the
  // stored value must survive the save rather than being read back as blank.
  const prev = id ? db.jobs.find(function(x){ return x.id===id; }) : null;

  const data = {
    name:f.name.value.trim(), type:f.type.value,
    startDate:f.startDate.value, dueDate:f.dueDate.value, assigned:formPicks.slice(),
    status:f.status.value, handoverDate:f.handoverDate.value, notes:f.notes.value.trim(),

    total:       f.total       ? n(f.total.value)       : (prev ? prev.total : 0),
    advance:     f.advance     ? n(f.advance.value)     : (prev ? prev.advance : 0),
    advanceDate: f.advanceDate ? f.advanceDate.value    : (prev ? prev.advanceDate : ""),
    finalAmount: f.finalAmount ? n(f.finalAmount.value) : (prev ? prev.finalAmount : 0),
    finalDate:   f.finalDate   ? f.finalDate.value      : (prev ? prev.finalDate : ""),

    outsourceCost:     f.outsourceCost     ? n(f.outsourceCost.value)  : (prev ? prev.outsourceCost : 0),
    outsourcePaid:     f.outsourcePaid     ? n(f.outsourcePaid.value)  : (prev ? prev.outsourcePaid : 0),
    outsourcePaidDate: f.outsourcePaidDate ? f.outsourcePaidDate.value : (prev ? prev.outsourcePaidDate : "")
  };

  if(custMode === "walkin"){
    data.customerName = f.customerName.value.trim();
    data.phone        = f.walkPhone.value.trim();
    data.customerId   = "";
    if(f.saveCustomer.checked){
      // Promote them to a real customer and point the job at that record, so
      // from here on it behaves exactly like any other saved customer.
      const c = {id:uid("c"), name:data.customerName, company:"", phone:data.phone, email:"", note:""};
      db.customers.push(c);
      data.customerId   = c.id;
      data.customerName = "";
      toast(c.name + " saved to your customers");
    }
  }else{
    data.customerId   = f.customerId.value;
    data.customerName = "";
    data.phone        = f.phone.value.trim();
  }

  data.outsourced = f.outsourced.checked;
  if(!data.outsourced){
    data.outsourceId = ""; data.outsourceName = "";
    data.outsourceCompany = ""; data.outsourcePhone = "";
    data.outsourceCost = 0; data.outsourcePaid = 0; data.outsourcePaidDate = "";
  }else if(f.outsourceId.value){
    data.outsourceId = f.outsourceId.value;
    data.outsourceName = ""; data.outsourceCompany = ""; data.outsourcePhone = "";
  }else{
    data.outsourceName    = f.outsourceName.value.trim();
    data.outsourceCompany = f.outsourceCompany.value.trim();
    data.outsourcePhone   = f.outsourcePhone.value.trim();
    data.outsourceId      = "";
    if(f.savePartner.checked){
      const p = {id:uid("p"), name:data.outsourceName, company:data.outsourceCompany,
                 phone:data.outsourcePhone, note:""};
      db.partners.push(p);
      data.outsourceId = p.id;
      data.outsourceName = ""; data.outsourceCompany = ""; data.outsourcePhone = "";
      toast((p.company || p.name) + " saved to your outsourcing list");
    }
  }

  const cust = data.customerId ? (custById(data.customerId)||{}).name
                               : (data.customerName || "Walk-in customer");
  const ok = await askConfirm({
    title: id ? "Save these changes?" : "Create this job?",
    ok:    id ? "Yes, save changes" : "Yes, create job",
    body:  '<p>'+esc(data.name)+'</p>'
      + '<dl>'
        + '<dt>Customer</dt><dd>'+esc(cust)+'</dd>'
        + '<dt>Deadline</dt><dd>'+fmtDate(data.dueDate)+'</dd>'
        + (canSetPayments(!!id)
            ? '<dt>Job total</dt><dd>'+money(data.total)+'</dd>'
              + '<dt>Advance</dt><dd>'+(data.advance?money(data.advance):"—")+'</dd>'
            : '')
        + (data.outsourced ? '<dt>Outsourced</dt><dd>Yes</dd>' : '')
      + '</dl>'
      + (canSetPayments(!!id) && !isAdmin()
          ? '<p style="margin-top:10px">Once saved, only the admin can change these amounts.</p>' : '')
  });
  if(!ok) return;

  let job;
  if(id){
    job = db.jobs.find(function(x){ return x.id===id; });
    Object.assign(job, data);
    toast("Job updated");
  }else{
    data.id = uid("j");
    data.code = nextCode();
    db.nextJobNo++;
    db.jobs.unshift(data);
    job = data;
    if(!stayOnPage) toast("Job " + data.code + " added");
  }
  save();

  if(stayOnPage){ renderNav(); newJobSaved(job); window.scrollTo(0,0); return; }
  closeDrawer(); render();
}

function customerForm(id){
  const editing = !!id;
  const c = editing ? custById(id) : {id:"", name:"", company:"", phone:"", email:"", note:""};
  const jobs = editing ? db.jobs.filter(function(j){ return j.customerId===id; }) : [];

  openDrawer(
    '<div class="drawer-head">'
      + '<div><h2>'+(editing?esc(c.name):"New customer")+'</h2>'
      + '<span class="jobcode">'+(editing? jobs.length+" job"+(jobs.length===1?"":"s")+" on record" : "Saved for reuse")+'</span></div>'
      + '<button class="btn btn-ghost btn-sm" data-close aria-label="Close">'+ICONS.close+'</button>'
    + '</div>'
    + '<form class="drawer-body" id="custForm" novalidate>'
      + '<div class="fieldset">'
        + '<span class="lbl">Details</span>'
        + '<label class="f"><span>Contact person</span><input class="input" name="name" value="'+esc(c.name)+'" placeholder="e.g. Kasun Rajapaksha" autocomplete="off"></label>'
        + '<label class="f"><span>Company <em>— leave blank for individuals</em></span><input class="input" name="company" value="'+esc(c.company)+'" placeholder="e.g. Ceylon Fresh Exports (Pvt) Ltd" autocomplete="off"></label>'
        + '<div class="grid2">'
          + '<label class="f"><span>Phone</span><input class="input num" name="phone" value="'+esc(c.phone)+'" placeholder="011 271 4400" autocomplete="off"></label>'
          + '<label class="f"><span>Email <em>— optional</em></span><input class="input" name="email" value="'+esc(c.email)+'" placeholder="optional" autocomplete="off"></label>'
        + '</div>'
        + '<label class="f"><span>Note</span><textarea class="textarea" name="note" placeholder="Payment terms, delivery preferences, anything to remember…">'+esc(c.note)+'</textarea></label>'
      + '</div>'
      + (editing && jobs.length ? '<div class="fieldset"><span class="lbl">Job history</span>'
          + '<div class="ledger">' + jobs.slice().reverse().map(function(j){
              return '<div class="ledger-row"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(j.name)+'</span>'
                + '<span class="chip '+chipClass(j.status)+'" style="margin-left:auto"><span class="dot"></span>'+esc(statusMeta(j.status).label)+'</span>'
                + '<span class="money">'+money(j.total)+'</span></div>';
            }).join("") + '</div></div>' : '')
      + '<p class="err" id="formErr" hidden></p>'
    + '</form>'
    + '<div class="drawer-foot">'
      + '<button class="btn btn-sm" data-close>Cancel</button>'
      + (canDelete() && editing && !jobs.length ? '<button class="btn btn-sm btn-danger" data-delete-customer="'+id+'">Delete</button>' : '')
      + '<button class="btn btn-sm btn-primary" data-save-customer="'+(editing?id:"")+'">'+(editing?"Save changes":"Add customer")+'</button>'
    + '</div>'
  );
}

function saveCustomer(id){
  const f = $("#custForm"), err = $("#formErr");
  f.querySelectorAll(".bad").forEach(function(el){ el.classList.remove("bad"); });
  if(!f.name.value.trim()){
    err.textContent = "Enter the contact person's name."; err.hidden = false;
    f.name.classList.add("bad"); return;
  }
  const data = {
    name:f.name.value.trim(), company:f.company.value.trim(), phone:f.phone.value.trim(),
    email:f.email.value.trim(), note:f.note.value.trim()
  };
  if(id){ Object.assign(custById(id), data); toast("Customer updated"); }
  else{ data.id = uid("c"); db.customers.push(data); toast(data.name + " saved"); }
  save(); closeDrawer(); render();
}

function staffForm(id){
  const editing = !!id;
  const s = editing ? staffById(id) : {id:"", name:"", role:"", phone:"", active:true};
  const jobs = editing ? db.jobs.filter(function(j){ return (j.assigned||[]).indexOf(id)>-1; }) : [];

  openDrawer(
    '<div class="drawer-head">'
      + '<div><h2>'+(editing?esc(s.name):"Add a person")+'</h2>'
      + '<span class="jobcode">'+(editing? jobs.filter(isActive).length+" jobs running" : "Selectable when assigning work")+'</span></div>'
      + '<button class="btn btn-ghost btn-sm" data-close aria-label="Close">'+ICONS.close+'</button>'
    + '</div>'
    + '<form class="drawer-body" id="staffForm" novalidate>'
      + '<div class="fieldset">'
        + '<span class="lbl">Details</span>'
        + '<label class="f"><span>Full name</span><input class="input" name="name" value="'+esc(s.name)+'" placeholder="e.g. Nuwan Perera" autocomplete="off"></label>'
        + '<div class="grid2">'
          + '<label class="f"><span>Role</span><input class="input" name="role" value="'+esc(s.role)+'" placeholder="e.g. Press Operator" autocomplete="off"></label>'
          + '<label class="f"><span>Phone</span><input class="input num" name="phone" value="'+esc(s.phone)+'" placeholder="077 214 5566" autocomplete="off"></label>'
        + '</div>'
        + '<label class="f"><span>Availability</span>'
          + '<select class="select" name="active">'
            + '<option value="1"'+(s.active?' selected':'')+'>Active — can be assigned jobs</option>'
            + '<option value="0"'+(!s.active?' selected':'')+'>Inactive — hide from the assign list</option>'
          + '</select></label>'
      + '</div>'
      + (editing && jobs.length ? '<div class="fieldset"><span class="lbl">Current workload</span>'
          + '<div class="ledger">' + jobs.filter(isActive).map(function(j){
              return '<div class="ledger-row"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(j.name)+'</span>'
                + '<span class="chip '+chipClass(j.status)+'" style="margin-left:auto"><span class="dot"></span>'+esc(statusMeta(j.status).label)+'</span></div>';
            }).join("") + '</div></div>' : '')
      + '<p class="err" id="formErr" hidden></p>'
    + '</form>'
    + '<div class="drawer-foot">'
      + '<button class="btn btn-sm" data-close>Cancel</button>'
      + (canDelete() && editing && !jobs.length ? '<button class="btn btn-sm btn-danger" data-delete-staff="'+id+'">Delete</button>' : '')
      + '<button class="btn btn-sm btn-primary" data-save-staff="'+(editing?id:"")+'">'+(editing?"Save changes":"Add person")+'</button>'
    + '</div>'
  );
}

function saveStaff(id){
  const f = $("#staffForm"), err = $("#formErr");
  f.querySelectorAll(".bad").forEach(function(el){ el.classList.remove("bad"); });
  if(!f.name.value.trim()){
    err.textContent = "Enter the person's name."; err.hidden = false;
    f.name.classList.add("bad"); return;
  }
  const data = {name:f.name.value.trim(), role:f.role.value.trim(), phone:f.phone.value.trim(), active:f.active.value==="1"};
  if(id){ Object.assign(staffById(id), data); toast("Details updated"); }
  else{ data.id = uid("s"); db.staff.push(data); toast(data.name + " added to the team"); }
  save(); closeDrawer(); render();
}

/* ===================== RENDER ===================== */

const HEADERS = {
  dashboard:{t:"Dashboard", s:"Everything happening in the shop right now"},
  jobs:{t:"Jobs", s:"Every job in the register"},
  "new":{t:"New Job", s:"Fill this in and the job goes straight into the register"},
  payments:{t:"Payments", s:"Advances, final payments and what is still owed"},
  analytics:{t:"Analytics", s:"How the shop is doing, by day, week or month"},
  customers:{t:"Customers", s:"Saved customers you can pick when adding a job"},
  outsourcing:{t:"Outsourcing", s:"Places you send work to when it can't be done in-house"},
  team:{t:"Team", s:"People you can assign jobs to"}
};

function renderHeader(){
  const h = HEADERS[route];
  $("#pageTitle").textContent = h.t;
  $("#pageSub").textContent = h.s;

  let actions = "";
  if(route==="jobs" || route==="dashboard" || route==="payments"){
    actions += '<div class="field"><span>'+ICONS.search+'</span>'
      + '<input class="input searchbox" id="search" placeholder="Search jobs or customers" value="'+esc(filter.q)+'" autocomplete="off"></div>';
  }
  {
    if(route==="jobs" || route==="dashboard")
      actions += '<button class="btn btn-primary" data-new="job">'+ICONS.plus+'New job</button>';
    if(route==="customers")
      actions += '<button class="btn btn-primary" data-new="customer">'+ICONS.plus+'Add customer</button>';
    if(route==="outsourcing")
      actions += '<button class="btn btn-primary" data-new="partner">'+ICONS.plus+'Add place</button>';
    if(route==="team")
      actions += '<button class="btn btn-primary" data-new="staff">'+ICONS.plus+'Add person</button>';
  }
  $("#pageActions").innerHTML = actions;
}

function go(to, replace){
  if(ROUTES.indexOf(to) === -1) to = homeRoute();
  if(!pageAllowed(to)) to = homeRoute();        // staff can't reach admin pages by URL
  route = to;
  const hash = "#" + to;
  if(location.hash !== hash){
    if(replace) history.replaceState(null, "", hash);
    else location.hash = hash;                   // fires hashchange → render()
    if(!replace) return;
  }
  render();
  window.scrollTo(0,0);
}

function routeFromHash(){
  const h = (location.hash || "").replace(/^#\/?/, "").toLowerCase();
  if(ROUTES.indexOf(h) === -1 || !pageAllowed(h)) return homeRoute();
  return h;
}

function render(){
  renderNav();
  renderHeader();
  if(route==="dashboard") renderDashboard();
  else if(route==="jobs") renderJobs();
  else if(route==="new") renderNewJobPage();
  else if(route==="payments") renderPayments();
  else if(route==="analytics") renderAnalytics();
  else if(route==="customers") renderCustomers();
  else if(route==="outsourcing") renderOutsourcing();
  else if(route==="team") renderTeam();
}

/* ===================== EVENTS ===================== */

document.addEventListener("click", function(e){
  const t = e.target;

  const conf = t.closest("[data-confirm]");
  if(conf){ closeConfirm(conf.getAttribute("data-confirm") === "1"); return; }
  if(t.id === "confirm"){ closeConfirm(false); return; }

  if(t.closest("[data-more]")){ toggleMore(); return; }
  if(t.id === "moreScrim"){ toggleMore(false); return; }

  const nav = t.closest("[data-nav]");
  if(nav){
    const to = nav.getAttribute("data-nav");
    if(to==="jobs" && filter.q) filter.tab = "all";
    toggleMore(false);
    closeDrawer();
    if(to==="new" && route==="new") renderNewJobPage();   // "Add another" — fresh blank form
    else go(to);
    return;
  }

  const openJob = t.closest("[data-open-job]");
  if(openJob){ jobDetail(openJob.getAttribute("data-open-job")); return; }

  const mode = t.closest("[data-custmode]");
  if(mode){
    custMode = mode.getAttribute("data-custmode");
    document.querySelectorAll("[data-custmode]").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-custmode")===custMode);
    });
    const saved = $("#custSaved"), walk = $("#custWalkin");
    if(saved) saved.hidden = custMode!=="saved";
    if(walk)  walk.hidden  = custMode!=="walkin";
    const err = $("#formErr"); if(err) err.hidden = true;
    const focus = custMode==="walkin" ? $("#jobForm [name=customerName]") : $("#jobForm [name=customerId]");
    if(focus) focus.focus();
    return;
  }

  const tab = t.closest("[data-tab]");
  if(tab){ filter.tab = tab.getAttribute("data-tab"); render(); return; }

  const rng = t.closest("[data-range]");
  if(rng){ range = rng.getAttribute("data-range"); renderAnalytics(); return; }

  if(t.closest("[data-close]")){ closeDrawer(); return; }

  const jobRow = t.closest("[data-job]");
  if(jobRow){ jobDetail(jobRow.getAttribute("data-job")); return; }

  const custRow = t.closest("[data-customer]");
  if(custRow){ customerForm(custRow.getAttribute("data-customer")); return; }

  const staffRow = t.closest("[data-staff]");
  if(staffRow){ staffForm(staffRow.getAttribute("data-staff")); return; }

  const partnerRow = t.closest("[data-partner]");
  if(partnerRow){ partnerForm(partnerRow.getAttribute("data-partner")); return; }

  const nw = t.closest("[data-new]");
  if(nw){
    const kind = nw.getAttribute("data-new");
    if(kind==="job") jobForm("");
    else if(kind==="customer") customerForm("");
    else if(kind==="partner") partnerForm("");
    else staffForm("");
    return;
  }

  const editJob = t.closest("[data-edit-job]");
  if(editJob){ jobForm(editJob.getAttribute("data-edit-job")); return; }

  const saveJobBtn = t.closest("[data-save-job]");
  if(saveJobBtn){
    saveJob(saveJobBtn.getAttribute("data-save-job"), saveJobBtn.hasAttribute("data-stay"));
    return;
  }

  const saveCustBtn = t.closest("[data-save-customer]");
  if(saveCustBtn){ saveCustomer(saveCustBtn.getAttribute("data-save-customer")); return; }

  const saveStaffBtn = t.closest("[data-save-staff]");
  if(saveStaffBtn){ saveStaff(saveStaffBtn.getAttribute("data-save-staff")); return; }

  const savePartnerBtn = t.closest("[data-save-partner]");
  if(savePartnerBtn){ savePartner(savePartnerBtn.getAttribute("data-save-partner")); return; }

  const delPartner = t.closest("[data-delete-partner]");
  if(delPartner){
    const id = delPartner.getAttribute("data-delete-partner");
    db.partners = db.partners.filter(function(x){ return x.id!==id; });
    save(); closeDrawer(); render(); toast("Removed from your outsourcing list");
    return;
  }

  const delJob = t.closest("[data-delete-job]");
  if(delJob){
    const id = delJob.getAttribute("data-delete-job");
    const j = db.jobs.find(function(x){ return x.id===id; });
    if(confirm('Delete "'+j.name+'"? This cannot be undone.')){
      db.jobs = db.jobs.filter(function(x){ return x.id!==id; });
      save(); closeDrawer(); render(); toast("Job deleted");
    }
    return;
  }

  const delCust = t.closest("[data-delete-customer]");
  if(delCust){
    const id = delCust.getAttribute("data-delete-customer");
    db.customers = db.customers.filter(function(x){ return x.id!==id; });
    save(); closeDrawer(); render(); toast("Customer removed");
    return;
  }

  const delStaff = t.closest("[data-delete-staff]");
  if(delStaff){
    const id = delStaff.getAttribute("data-delete-staff");
    db.staff = db.staff.filter(function(x){ return x.id!==id; });
    save(); closeDrawer(); render(); toast("Person removed");
    return;
  }

  // Stage buttons in the job detail
  const stage = t.closest("[data-stage]");
  if(stage && !stage.disabled){
    const id = stage.closest(".drawer").querySelector("[data-edit-job]");
    const jobId = id ? id.getAttribute("data-edit-job") : null;
    if(jobId){
      const j = db.jobs.find(function(x){ return x.id===jobId; });
      j.status = stage.getAttribute("data-stage");
      if(j.status==="delivered" && !j.handoverDate) j.handoverDate = TODAY;
      save(); jobDetail(jobId); renderNav();
      if(route!=="team" && route!=="customers"){
        if(route==="dashboard") renderDashboard();
        else if(route==="jobs") renderJobs();
        else if(route==="payments") renderPayments();
      }
      toast("Moved to " + statusMeta(j.status).label);
    }
    return;
  }

  // Assign-person toggles (max 2)
  const pick = t.closest("[data-pick]");
  if(pick){
    const id = pick.getAttribute("data-pick");
    const i = formPicks.indexOf(id);
    if(i > -1) formPicks.splice(i,1);
    else if(formPicks.length < 2) formPicks.push(id);
    else { toast("Two people maximum — deselect one first"); return; }
    document.querySelectorAll("[data-pick]").forEach(function(b){
      b.setAttribute("aria-pressed", formPicks.indexOf(b.getAttribute("data-pick"))>-1);
    });
    return;
  }

  if(t.id === "scrim"){ closeDrawer(); return; }

  if(t.id === "switchRole" || t.closest(".js-leaveadmin")){
    const to = isAdmin() ? "staff" : "admin";
    setRole(to);
    closeDrawer(); toggleMore(false);
    go(pageAllowed(route) ? route : homeRoute(), true);
    toast(to === "admin" ? "Admin view — full access" : "Staff view — jobs, customers, outsourcing");
    return;
  }

  if(t.id === "resetDemo"){
    if(confirm("Reset the demo back to the original sample data?")){
      db = seed(); save(); closeDrawer(); filter={q:"",tab:"active"};
      go("dashboard", true);
      toast("Demo data reset");
    }
    return;
  }
});

window.addEventListener("hashchange", function(){
  // The role links are hashes too, and following one while the app is already
  // open changes the hash without reloading — so re-read the role here as well.
  const h = (location.hash || "").replace(/^#\/?/, "").toLowerCase();
  if(h === "admin" || h === "staff"){
    const to = h === "admin" ? "admin" : "staff";
    const changed = to !== role;
    setRole(to);
    toggleMore(false); closeDrawer();
    go(homeRoute(), true);
    if(changed) toast(to === "admin" ? "Admin view — full access" : "Staff view — jobs, customers, outsourcing");
    return;
  }
  route = routeFromHash();
  toggleMore(false); closeDrawer(); render(); window.scrollTo(0,0);
});

document.addEventListener("input", function(e){
  const t = e.target;
  if(t.id === "search"){
    filter.q = t.value;
    if(route==="jobs"){
      const list = filteredJobs();
      const card = document.querySelector(".content .card");
      if(card) card.innerHTML = jobTable(list);
      const hint = document.querySelector(".content .hint");
      if(hint) hint.innerHTML = 'Showing <b class="num">'+list.length+'</b> of '+db.jobs.length+' jobs. Click any row to open it.';
    }else{
      filter.tab = "all"; go("jobs", true);
      const s = $("#search"); if(s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }
    return;
  }
  if(t.form && t.form.id === "jobForm"){
    if(t.name==="total" || t.name==="advance" || t.name==="finalAmount") updateCalc();
    if(t.name==="total" || t.name==="outsourceCost") updateComm();
    if(t.name==="customerId") updateCustHint();
  }
});

document.addEventListener("change", function(e){
  const t = e.target;
  if(t.name==="customerId") updateCustHint();
  if(t.name==="outsourced"){
    const box = $("#outsrcBox");
    if(box) box.hidden = !t.checked;
    updateOutsrc();
  }
  if(t.name==="outsourceId") updateOutsrc();
  if(t.name==="outsourced") updateComm();
});

/* Picking a saved outsourcer hides the type-it-in fields, and vice versa. */
function updateOutsrc(){
  const f = $("#jobForm"); if(!f || !f.outsourceId) return;
  const box = $("#outsrcNew"), hint = $("#outsrcHint");
  const p = partnerById(f.outsourceId.value);
  if(box) box.hidden = !!p;
  if(!hint) return;
  if(p){
    hint.innerHTML = 'Sending to <b>'+esc(p.company || p.name)+'</b>'
      + (p.phone ? ' · <span class="num">'+esc(p.phone)+'</span>' : '')
      + (p.note ? ' · '+esc(p.note) : '');
  }else{
    hint.textContent = "Only the name is required. Save them if you use them often.";
  }
}

/* Chart tooltips — one listener for every mark that carries a data-tip. */
document.addEventListener("mouseover", function(e){
  const m = e.target.closest && e.target.closest("[data-tip]");
  if(!m) return;
  const tip = $("#charttip");
  tip.textContent = m.getAttribute("data-tip");
  const r = m.getBoundingClientRect();
  tip.style.left = (r.left + r.width/2) + "px";
  tip.style.top  = r.top + "px";
  tip.classList.add("show");
});
document.addEventListener("mouseout", function(e){
  if(e.target.closest && e.target.closest("[data-tip]")) $("#charttip").classList.remove("show");
});

document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if(confirmResolve) closeConfirm(false);
  else if(drawerOpen) closeDrawer();
  else if(!$("#moreSheet").hidden) toggleMore(false);
});

/* Charts pick their viewBox from the viewport, so they must be rebuilt when it
   crosses the narrow breakpoint — nothing else in the app needs a re-render. */
let wasNarrow = isNarrow();
window.addEventListener("resize", function(){
  const now = isNarrow();
  if(now === wasNarrow) return;
  wasNarrow = now;
  if(route === "analytics") renderAnalytics();
});

/* ===================== BOOT ===================== */
loadRole();
document.body.setAttribute("data-role-mode", role);
load();
route = routeFromHash();
go(route, true);

})();
</script>
