server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    server_tokens off;

    # TLS is terminated by Dokploy's Traefik in front of this container,
    # so plain HTTP on :80 is correct here.

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    # text/html is always gzipped by nginx; listing it here would only log a
    # "duplicate MIME type" warning on every start.
    gzip_types      text/plain text/css application/javascript image/svg+xml;

    # nginx only inherits add_header from an outer block when the inner block
    # declares none of its own — so every header lives here, at server level,
    # and no location below is allowed to add one.
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header X-Frame-Options        "DENY"                        always;
    add_header Referrer-Policy        "no-referrer"                 always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    # Only relevant once Traefik is terminating TLS, which it is in production.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The app is entirely self-contained: no CDN, no fonts, no analytics, no
    # network calls at all. So everything external is denied outright, and only
    # the inline style/script the single file carries is allowed.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # The entire app is one HTML file. Caching it would leave people on an old
    # version after a redeploy, so revalidate every time — the browser still
    # gets a 304 when nothing changed, so nothing is re-downloaded.
    add_header Cache-Control          "no-cache, must-revalidate"    always;

    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200   "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
